<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Themes Large</title>
    <style>
        :root {
            --bg-color: #0d0e15;
            --panel-bg: rgba(20, 21, 33, 0.85);
            --text-color: #e2e8f0;
            --neon-cyan: #00ffcc;
        }

        /* Усиленные сочные неоновые цвета для крупных названий */
        .neon-0 { --neon-color: #ff0055; --neon-glow: 0 0 20px #ff0055, 0 0 35px rgba(255, 0, 85, 0.5); }
        .neon-1 { --neon-color: #00ffcc; --neon-glow: 0 0 20px #00ffcc, 0 0 35px rgba(0, 255, 204, 0.5); }
        .neon-2 { --neon-color: #9b51e0; --neon-glow: 0 0 20px #9b51e0, 0 0 35px rgba(155, 81, 224, 0.5); }
        .neon-3 { --neon-color: #ff9900; --neon-glow: 0 0 20px #ff9900, 0 0 35px rgba(255, 153, 0, 0.5); }
        .neon-4 { --neon-color: #00ff33; --neon-glow: 0 0 20px #00ff33, 0 0 35px rgba(0, 255, 51, 0.5); }
        .neon-5 { --neon-color: #ffff00; --neon-glow: 0 0 20px #ffff00, 0 0 35px rgba(255, 255, 0, 0.5); }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #1a1c2e 0%, #0d0e15 100%);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            /* Увеличенный верхний отступ, чтобы кнопка «Главная» ничего не перекрывала */
            padding: 110px 20px 40px; 
        }

        /* Крупная, заметная кнопка Главное меню */
        .home-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            padding: 14px 24px; /* Больше отступы */
            background: var(--panel-bg);
            border: 3px solid var(--neon-cyan); /* Толще рамка */
            border-radius: 12px;
            color: var(--neon-cyan);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 18px; /* Крупный шрифт */
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3), inset 0 0 10px rgba(0, 255, 204, 0.1);
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .home-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.8);
            background: var(--neon-cyan);
            color: #000;
        }

        /* Ограничитель ширины списка на больших экранах */
        .theme-list {
            max-width: 600px;
            margin: 0 auto;
            list-style: none;
        }

        /* Элемент списка (Крупная плашка) */
        .theme-item {
            background: var(--panel-bg);
            border: 2px solid rgba(255, 255, 255, 0.08); /* Толще базовая граница */
            border-radius: 16px; /* Более округлые углы */
            margin-bottom: 24px; /* Больше расстояние между кнопками */
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, border-color 0.3s ease;
        }

        .theme-item:active {
            transform: scale(0.97);
        }

        /* Шапка с Названием — сделана огромной для удобства тапа */
        .theme-header {
            padding: 26px 24px; /* Огромная область для нажатия пальцем */
            font-size: 24px; /* Крупный размер текста */
            font-weight: 800;
            color: var(--neon-color);
            text-shadow: var(--neon-glow);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid transparent;
            transition: border-color 0.3s ease;
        }

        /* Когда тема открыта, нижняя граница подсвечивается неоном */
        .theme-item.active {
            border-color: var(--neon-color);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4), 0 0 15px var(--neon-color);
        }

        .theme-item.active .theme-header {
            border-color: var(--neon-color);
        }

        /* Индикатор-стрелочка (тоже увеличен) */
        .theme-header::after {
            content: '▼';
            font-size: 16px;
            color: var(--neon-color);
            text-shadow: var(--neon-glow);
            transition: transform 0.3s ease;
            opacity: 0.8;
            margin-left: 15px;
        }

        .theme-item.active .theme-header::after {
            transform: rotate(180deg);
        }

        /* Контейнер для плавного раскрытия */
        .theme-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(0, 0, 0, 0.3);
        }

        /* Текст крупного описания внутри */
        .theme-description {
            padding: 24px;
            font-size: 19px; /* Легко читаемый крупный текст */
            line-height: 1.7;
            color: #cbd5e1;
            border-left: 5px solid var(--neon-color); /* Жирная полоса слева */
        }

        /* Сообщение загрузки */
        .status-msg {
            text-align: center;
            font-size: 22px;
            color: var(--neon-cyan);
            text-shadow: 0 0 15px var(--neon-cyan);
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <!-- Крупная кнопка возврата наверх -->
    <button class="home-btn" onclick="goHome()">Главная</button>

    <!-- Список неоновых тем -->
    <ul class="theme-list" id="themeList">
        <div class="status-msg">Загрузка неонового меню...</div>
    </ul>

    <script>
        async function loadThemes() {
            const listContainer = document.getElementById('themeList');
            
            try {
                const response = await fetch('op.json');
                if (!response.ok) throw new Error('Не удалось загрузить op.json');
                
                const themes = await response.json();
                listContainer.innerHTML = ''; 

                if (themes.length === 0) {
                    listContainer.innerHTML = '<div class="status-msg">Файл op.json пуст</div>';
                    return;
                }

                themes.forEach((theme, index) => {
                    const colorClass = `neon-${index % 6}`;
                    const li = document.createElement('li');
                    li.className = `theme-item ${colorClass}`;

                    li.innerHTML = `
                        <div class="theme-header">${escapeHtml(theme.name)}</div>
                        <div class="theme-body">
                            <div class="theme-description">${escapeHtml(theme.description)}</div>
                        </div>
                    `;

                    const header = li.querySelector('.theme-header');
                    const body = li.querySelector('.theme-body');

                    header.addEventListener('click', () => {
                        const isActive = li.classList.contains('active');
                        
                        document.querySelectorAll('.theme-item').forEach(item => {
                            item.classList.remove('active');
                            item.querySelector('.theme-body').style.maxHeight = null;
                        });

                        if (!isActive) {
                            li.classList.add('active');
                            body.style.maxHeight = body.scrollHeight + "px";
                        }
                    });

                    listContainer.appendChild(li);
                });

            } catch (error) {
                console.error(error);
                listContainer.innerHTML = `<div class="status-msg" style="color: #ff0055; text-shadow: 0 0 15px #ff0055;">Ошибка: ${error.message}</div>`;
            }
        }

        function goHome() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.querySelectorAll('.theme-item').forEach(item => {
                item.classList.remove('active');
                item.querySelector('.theme-body').style.maxHeight = null;
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        document.addEventListener('DOMContentLoaded', loadThemes);
    </script>
</body>
</html>
